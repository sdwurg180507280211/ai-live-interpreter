<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · {{BRAND}}</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<style>
  /* 两栏布局放在自己的容器上，不放在 body：浏览器插件常往 body 里插元素，会把网格挤乱。 */
  .layout { min-height: 100vh; display: grid; grid-template-columns: minmax(420px, 1fr) minmax(400px, 560px); }
  .layout > .hero { grid-column: 1; grid-row: 1; }
  .layout > .panel { grid-column: 2; grid-row: 1; }
  .hero {
    position: relative; overflow: hidden; color: #fff; padding: 48px 56px;
    background: radial-gradient(1200px 600px at 10% 110%, rgba(124, 58, 237, 0.9), transparent 60%),
                radial-gradient(900px 500px at 100% 0%, rgba(59, 130, 246, 0.55), transparent 60%),
                linear-gradient(160deg, #1e1b4b 0%, #312e81 55%, #4c1d95 100%);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .hero .brand-name { font-size: 19px; color: #fff; }
  .hero .brand-mark { background: rgba(255, 255, 255, 0.16); box-shadow: none; backdrop-filter: blur(4px); }
  .hero h1 { font-size: 40px; line-height: 1.25; margin: 0 0 16px; font-weight: 750; letter-spacing: 0.01em; }
  .hero p.lead { font-size: 17px; line-height: 1.7; color: rgba(255, 255, 255, 0.78); margin: 0 0 36px; max-width: 460px; }
  .features { display: grid; gap: 18px; max-width: 460px; }
  .feature { display: flex; gap: 14px; align-items: flex-start; }
  .feature .ic { width: 40px; height: 40px; border-radius: 11px; background: rgba(255, 255, 255, 0.12); display: grid; place-items: center; flex: none; }
  .feature .ic svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .feature b { display: block; font-size: 15px; margin-bottom: 2px; }
  .feature span { font-size: 13px; color: rgba(255, 255, 255, 0.68); }
  .wave { position: absolute; right: -40px; bottom: 110px; width: 520px; opacity: 0.16; }
  .hero footer { font-size: 12px; color: rgba(255, 255, 255, 0.5); }
  .panel { display: flex; align-items: center; justify-content: center; padding: 40px 32px; background: var(--surface); }
  form { width: 100%; max-width: 360px; }
  form h2 { font-size: 26px; margin: 0 0 6px; font-weight: 700; }
  form .sub { color: var(--fg-3); margin: 0 0 32px; }
  .pw { position: relative; }
  .pw .field { height: 48px; font-size: 16px; padding-right: 48px; }
  .pw button { position: absolute; right: 6px; top: 6px; width: 36px; height: 36px; border: 0; background: none; color: var(--fg-3); cursor: pointer; border-radius: 8px; display: grid; place-items: center; }
  .pw button:hover { background: var(--surface-2); color: var(--fg-2); }
  form .btn-primary { width: 100%; height: 48px; margin-top: 20px; font-size: 16px; }
  .error { display: none; align-items: center; gap: 8px; margin-top: 16px; padding: 10px 12px; border-radius: 10px; background: var(--danger-soft); color: #b91c1c; font-size: 14px; }
  .error.show { display: flex; }
  .mobile-brand { display: none; margin-bottom: 36px; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .layout > .panel { grid-column: 1; }
    .hero { display: none; }
    .mobile-brand { display: flex; }
  }
</style>
</head>
<body>
<div class="layout">
<section class="hero">
  <div class="brand">
    <div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg></div>
    <div class="brand-name">{{BRAND}}</div>
  </div>
  <div>
    <h1>说完即出字幕的<br>AI 同声传译</h1>
    <p class="lead">会议现场的外语发言，实时转成中文字幕投到大屏，观众用手机打开链接也能同步观看。</p>
    <div class="features">
      <div class="feature">
        <div class="ic"><svg viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
        <div><b>1~2 秒低延迟</b><span>每句话说完即刻上屏，逐字呈现</span></div>
      </div>
      <div class="feature">
        <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg></div>
        <div><b>20 多种语言</b><span>英、日、韩、法、德、俄等外语及粤语，译成中文</span></div>
      </div>
      <div class="feature">
        <div class="ic"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 22h8M12 18v4"/></svg></div>
        <div><b>浏览器即用</b><span>无需安装软件，大屏、平板、手机打开链接即可观看</span></div>
      </div>
    </div>
  </div>
  <svg class="wave" viewBox="0 0 520 120" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round">
    <path d="M10 60v0M40 45v30M70 25v70M100 40v40M130 10v100M160 35v50M190 50v20M220 20v80M250 5v110M280 30v60M310 45v30M340 15v90M370 40v40M400 25v70M430 50v20M460 35v50M490 55v10"/>
  </svg>
  <footer>© {{BRAND}}</footer>
</section>

<section class="panel">
  <form id="form" autocomplete="on">
    <div class="brand mobile-brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg></div>
      <div class="brand-name">{{BRAND}}</div>
    </div>
    <h2>欢迎回来</h2>
    <p class="sub">输入密码进入同传控制台</p>
    <label class="label" for="password">密码</label>
    <div class="pw">
      <input class="field" id="password" type="password" autocomplete="current-password" placeholder="请输入密码" autofocus required>
      <button type="button" id="reveal" aria-label="显示密码">
        <svg class="icon" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <button class="btn btn-primary" id="submit" type="submit">登录</button>
    <div class="error" id="error" role="alert">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      <span id="error-text"></span>
    </div>
  </form>
</section>
</div>

<script>
  const form = document.getElementById("form");
  const input = document.getElementById("password");
  const submit = document.getElementById("submit");
  const error = document.getElementById("error");
  const errorText = document.getElementById("error-text");
  document.getElementById("reveal").onclick = () => {
    input.type = input.type === "password" ? "text" : "password";
    input.focus();
  };
  form.onsubmit = async (event) => {
    event.preventDefault();
    submit.disabled = true;
    submit.textContent = "登录中…";
    error.classList.remove("show");
    try {
      const resp = await fetch("api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: input.value }),
      });
      const data = await resp.json().catch(() => ({}));
      if (resp.ok && data.ok) { location.reload(); return; }
      errorText.textContent = data.error || "登录失败（" + resp.status + "）";
    } catch {
      errorText.textContent = "网络连接失败，请稍后重试";
    }
    error.classList.add("show");
    submit.disabled = false;
    submit.textContent = "登录";
    input.select();
  };
</script>
</body>
</html>
